<html>
<head>
<title>Lists</title>
</head>
<body>
<h3>Unordered List</h3>
<ul>
<li>C</li>
<li>Java</li>
<li>Python</li>
</ul>
<h3>Ordered List</h3>
<ol>
<li>HTML</li>
<li>CSS</li>
<li>JS</li>
</ol>
<h3>Description List</h3>
<dl>
<dt>HTML</dt>
<dd>HyperText Markup Language</dd>
<dt>CSS</dt>
<dd>Cascading Style Sheets</dd>
</dl>
</body>
</html>
